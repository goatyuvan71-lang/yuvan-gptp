<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#dff2ff" />
  <title>YUVAN GPT</title>
  <style>
    :root { --blue:#168bd2; --ink:#174d70; --pale:#e5f4ff; --line:#c8e5f7; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif; color:var(--ink); background:linear-gradient(145deg,#d8efff,#f1f9ff 55%,#dcefff); min-height:100vh; }
    .app { max-width:900px; height:100dvh; min-height:560px; margin:auto; display:flex; flex-direction:column; padding:16px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:8px 2px 16px; }
    .brand { display:flex; align-items:center; gap:11px; font-weight:800; letter-spacing:.4px; font-size:20px; }
    .logo { width:40px;height:40px;border-radius:14px;background:var(--blue);color:white;display:grid;place-items:center;font-size:22px;box-shadow:0 5px 14px #168bd233; }
    button { cursor:pointer; border:0; font:inherit; }
    .new-chat { background:#fff;color:var(--ink);border:1px solid var(--line);padding:10px 14px;border-radius:13px;font-weight:650; }
    .chat { flex:1; overflow:auto; padding:10px 2px 18px; }
    .welcome { text-align:center; margin:10vh auto 30px; max-width:520px; }
    .welcome .spark { font-size:36px; }
    h1 { font-size:clamp(28px,5vw,42px); margin:10px 0 8px; color:#145b8a; }
    .sub { color:#54809c; margin:0; }
    .suggestions { display:flex; flex-wrap:wrap; gap:9px; justify-content:center; margin-top:25px; }
    .suggestions button { background:#ffffffb8; border:1px solid var(--line); color:#285f83; padding:10px 13px; border-radius:15px; }
    .message { display:flex; margin:16px 0; }
    .message.user { justify-content:flex-end; }
    .bubble { max-width:min(78%,650px); padding:13px 16px; border-radius:18px; line-height:1.5; white-space:pre-wrap; overflow-wrap:anywhere; }
    .user .bubble { background:#168bd2;color:white;border-bottom-right-radius:5px; }
    .assistant .bubble { background:#fff;color:#244f6b;border:1px solid #d8ebf7;border-bottom-left-radius:5px;box-shadow:0 4px 14px #397eaa0d; }
    .composer-wrap { background:#ffffffd9; border:1px solid var(--line); border-radius:22px; padding:10px; box-shadow:0 10px 30px #397eaa14; }
    form { display:flex; gap:9px; align-items:flex-end; }
    textarea { flex:1; resize:none; border:0; outline:0; background:transparent; color:#174d70; font:inherit; font-size:16px; padding:10px 8px; max-height:140px; min-height:42px; }
    textarea::placeholder { color:#83a6bd; }
    .send { width:43px;height:43px;border-radius:14px;background:var(--blue);color:white;font-size:20px;font-weight:700; }
    .send:disabled { opacity:.45; cursor:not-allowed; }
    .hint { text-align:center;font-size:11px;color:#7395aa;margin:9px 0 0; }
    footer { text-align:center;color:#5c88a5;font-size:12px;padding:12px 0 2px; }
    .typing { color:#7395aa;font-style:italic;font-size:13px;padding:5px 14px; }
    @media(max-width:600px){ .app{padding:10px;}.brand{font-size:18px}.bubble{max-width:88%}.welcome{margin-top:8vh} }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="brand"><div class="logo">✦</div><span>YUVAN GPT</span></div>
      <button class="new-chat" id="newChat" type="button">＋ New chat</button>
    </header>
    <section class="chat" id="chat" aria-live="polite">
      <div class="welcome" id="welcome">
        <div class="spark">💙</div>
        <h1>Hello! Welcome to Yuvan GPT</h1>
        <p class="sub">Ask me anything. Let's figure it out together.</p>
        <div class="suggestions">
          <button type="button">Give me a fun fact</button>
          <button type="button">Help me write a message</button>
          <button type="button">Explain something simply</button>
        </div>
      </div>
    </section>
    <div class="composer-wrap">
      <form id="form">
        <textarea id="prompt" rows="1" placeholder="Message Yuvan GPT..." aria-label="Your message"></textarea>
        <button class="send" id="send" aria-label="Send message" type="submit">↑</button>
      </form>
      <p class="hint">Yuvan GPT can make mistakes. Check important information.</p>
    </div>
    <footer>Made with 💙 by Yuvan</footer>
  </main>
  <script>
    const chat = document.getElementById('chat');
    const welcome = document.getElementById('welcome');
    const form = document.getElementById('form');
    const promptBox = document.getElementById('prompt');
    const send = document.getElementById('send');
    let history = [];

    function addMessage(role, text) {
      if (welcome) welcome.remove();
      const row = document.createElement('div');
      row.className = `message ${role}`;
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;
      row.appendChild(bubble);
      chat.appendChild(row);
      chat.scrollTop = chat.scrollHeight;
      return row;
    }
    async function sendMessage(text) {
      const clean = text.trim();
      if (!clean || send.disabled) return;
      addMessage('user', clean);
      history.push({ role:'user', content:clean });
      promptBox.value = '';
      promptBox.style.height = 'auto';
      send.disabled = true;
      const typing = document.createElement('div');
      typing.className = 'typing';
      typing.textContent = 'Yuvan GPT is thinking…';
      chat.appendChild(typing);
      chat.scrollTop = chat.scrollHeight;
      try {
        const res = await fetch('/api/chat', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({ messages:history })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Something went wrong.');
        const reply = data.reply || 'I could not create a reply. Please try again.';
        history.push({ role:'assistant', content:reply });
        typing.remove();
        addMessage('assistant', reply);
      } catch (err) {
        typing.remove();
        addMessage('assistant', `Sorry! ${err.message} Please try again in a moment.`);
        history.pop();
      } finally {
        send.disabled = false;
        promptBox.focus();
      }
    }
    form.addEventListener('submit', e => { e.preventDefault(); sendMessage(promptBox.value); });
    promptBox.addEventListener('input', () => {
      promptBox.style.height = 'auto';
      promptBox.style.height = Math.min(promptBox.scrollHeight,140) + 'px';
    });
    promptBox.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
    });
    document.querySelectorAll('.suggestions button').forEach(b => b.addEventListener('click', () => sendMessage(b.textContent)));
    document.getElementById('newChat').addEventListener('click', () => {
      history = [];
      chat.innerHTML = '';
      const w = document.createElement('div');
      w.className = 'welcome';
      w.id = 'welcome';
      w.innerHTML = '<div class="spark">💙</div><h1>What shall we explore?</h1><p class="sub">Ask Yuvan GPT anything.</p>';
      chat.appendChild(w);
      promptBox.focus();
    });
  </script>
</body>
</html>
